<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ status }} · Route Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="page error-page">
    <div>
      <div class="code">{{ status }}</div>
      <h1>{% if status == 404 %}Page not found{% elif status == 403 %}Access restricted{% elif status == 503 %}Service unavailable{% else %}Something went wrong{% endif %}</h1>
      <p class="muted mt-2">{{ message }}</p>
      <p class="mt-3"><a class="btn btn-primary" href="/">Back to the application</a></p>
    </div>
  </main>
</body>
</html>
